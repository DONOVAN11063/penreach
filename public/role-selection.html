<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Role - Penreach Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }
        
        .selection-card {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #333;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 50px;
        }
        
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .role-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .role-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .role-card:hover::before {
            transform: scaleX(1);
        }
        
        .role-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .role-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #333;
        }
        
        .role-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .role-badge {
            display: inline-block;
            background: #e0e7ff;
            color: #667eea;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .back-btn {
            background: #64748b;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .back-btn:hover {
            background: #475569;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .selection-card {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .roles-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="selection-card">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1>Select Your Role</h1>
            <p class="subtitle">Choose how you want to access the Penreach learning portal</p>
            
            <div class="roles-grid">
                <div class="role-card" onclick="selectRole('student')">
                    <div class="role-icon">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h3>Student</h3>
                    <p>Access learning materials, videos, and quizzes tailored to your grade level and phase.</p>
                    <span class="role-badge">Learner</span>
                </div>
                
                <div class="role-card" onclick="selectRole('teacher')">
                    <div class="role-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <h3>Teacher</h3>
                    <p>Access teaching resources and materials for the phases you teach. Register or login to continue.</p>
                    <span class="role-badge">Educator</span>
                </div>
            </div>
            
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back to Home
            </button>
        </div>
    </div>

    <script>
        // Select role and redirect
        function selectRole(role) {
            if (role === 'student') {
                window.location.href = 'phase-selection.html';
            } else if (role === 'teacher') {
                // Always go to teacher login/register
                window.location.href = 'teacher-auth.html';
            }
        }
        
        // Go back to home
        function goBack() {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
