<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Authentication - Penreach Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            text-align: center;
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            color: #333;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .tab-btn.active {
            color: #667eea;
        }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .phases-selection {
            margin-bottom: 20px;
        }
        
        .phases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .phase-checkbox {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .phase-checkbox:hover {
            border-color: #667eea;
        }
        
        .phase-checkbox input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .phase-checkbox.checked {
            background: #e0e7ff;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #64748b;
            color: white;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .auth-card {
                padding: 30px 20px;
            }
            
            .phases-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <h1>Teacher Portal</h1>
            <p class="subtitle">Access teaching resources and materials</p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Register</button>
            </div>
            
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Processing...</p>
            </div>
            
            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <!-- Register Form -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label for="reg-username">Username *</label>
                    <input type="text" id="reg-username" required placeholder="Choose a username">
                </div>
                
                <div class="form-group">
                    <label for="reg-email">Email *</label>
                    <input type="email" id="reg-email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="reg-fullname">Full Name *</label>
                    <input type="text" id="reg-fullname" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="reg-password">Password *</label>
                    <input type="password" id="reg-password" required placeholder="Create a password">
                </div>
                
                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password *</label>
                    <input type="password" id="reg-confirm-password" required placeholder="Confirm your password">
                </div>
                
                <div class="form-group phases-selection">
                    <label>Select Teaching Phases *</label>
                    <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">Choose all phases you teach (you can select multiple)</p>
                    <div class="phases-grid">
                        <label class="phase-checkbox">
                            <input type="checkbox" value="Foundation" onchange="updatePhaseSelection(this)">
                            <span>Foundation Phase</span>
                        </label>
                        <label class="phase-checkbox">
                            <input type="checkbox" value="Intermediate" onchange="updatePhaseSelection(this)">
                            <span>Intermediate Phase</span>
                        </label>
                        <label class="phase-checkbox">
                            <input type="checkbox" value="Senior" onchange="updatePhaseSelection(this)">
                            <span>Senior Phase</span>
                        </label>
                        <label class="phase-checkbox">
                            <input type="checkbox" value="FET" onchange="updatePhaseSelection(this)">
                            <span>FET</span>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>
            
            <div class="back-link">
                <a href="role-selection.html">
                    <i class="fas fa-arrow-left"></i> Back to Role Selection
                </a>
            </div>
        </div>
    </div>

    <script>
        let selectedPhases = [];
        
        // Show tab
        function showTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabBtns = document.querySelectorAll('.tab-btn');
            
            tabBtns.forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabBtns[0].classList.add('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabBtns[1].classList.add('active');
            }
            
            hideMessages();
        }
        
        // Update phase selection
        function updatePhaseSelection(checkbox) {
            const phase = checkbox.value;
            const label = checkbox.closest('.phase-checkbox');
            
            if (checkbox.checked) {
                selectedPhases.push(phase);
                label.classList.add('checked');
            } else {
                selectedPhases = selectedPhases.filter(p => p !== phase);
                label.classList.remove('checked');
            }
        }
        
        // Hide messages
        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }
        
        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }
        
        // Show success
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }
        
        // Set loading
        function setLoading(isLoading) {
            document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
        }
        
        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }
            
            setLoading(true);
            hideMessages();
            
            try {
                const response = await fetch('/api/auth/teacher/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('Login successful! Redirecting...');
                    
                    if (data.token) {
                        localStorage.setItem('teacherToken', data.token);
                    }
                    
                    if (data.teacher) {
                        localStorage.setItem('teacherInfo', JSON.stringify(data.teacher));
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'teachers-home.html';
                    }, 1000);
                } else {
                    showError(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please try again later.');
            } finally {
                setLoading(false);
            }
        });
        
        // Register form submission
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const fullName = document.getElementById('reg-fullname').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            
            if (!username || !email || !fullName || !password || !confirmPassword) {
                showError('Please fill in all required fields');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (selectedPhases.length === 0) {
                showError('Please select at least one teaching phase');
                return;
            }
            
            setLoading(true);
            hideMessages();
            
            try {
                const response = await fetch('/api/auth/teacher/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        fullName,
                        password,
                        phases: selectedPhases
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('Registration successful! Redirecting to login...');
                    
                    if (data.token) {
                        localStorage.setItem('teacherToken', data.token);
                    }
                    
                    if (data.teacher) {
                        localStorage.setItem('teacherInfo', JSON.stringify(data.teacher));
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'teachers-home.html';
                    }, 1500);
                } else {
                    showError(data.message || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showError('Network error. Please try again later.');
            } finally {
                setLoading(false);
            }
        });
        
        // Check if already logged in
        function checkExistingAuth() {
            const token = localStorage.getItem('teacherToken');
            if (token) {
                window.location.href = 'teachers-home.html';
            }
        }
        
        // Check authentication on page load
        checkExistingAuth();
    </script>
</body>
</html>
